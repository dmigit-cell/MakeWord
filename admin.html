<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админка · Составь Слово</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #0a0e1a; color: #fff; padding: 20px; }
  .container { max-width: 1100px; margin: 0 auto; }
  .card { background: #1a2f5e; padding: 20px; border-radius: 16px; border: 1px solid #f5c842; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { padding: 10px; border-bottom: 1px solid #334; text-align: left; white-space: nowrap; }
  th { color: #f5c842; }
  .win { color: #4ade80; } .loss { color: #ff7777; } .timeout { color: #f5c842; }
  .btn { padding: 10px 20px; background: #f5c842; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 10px 5px 0 0; color: #000;}
  .del-btn { background: #ff7777; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
</style>
</head>
<body>
  <div class="container">
    <h1>Админ-панель</h1>
    <div class="card" id="content">Загрузка...</div>
    <button class="btn" onclick="loadStats()">Обновить</button>
    <button class="btn" onclick="logout()" style="background:#555; color:white;">Выйти</button>
  </div>
  <script>
    // Проверка авторизации и роли
    const userStr = localStorage.getItem('user');
    if (!userStr) window.location.href = 'login.html';
    const user = JSON.parse(userStr);
    if (user.role !== 'admin') {
      alert('Доступ только для администратора');
      window.location.href = 'profile.html';
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/stats', {
          headers: { 'X-User': user.username }
        });
        if (!res.ok) throw new Error('Ошибка сервера');
        const data = await res.json();
        
        let html = '<table><tr><th>ID</th><th>Игрок</th><th>Слово</th><th>Счёт</th><th>Результат</th><th>Настройки</th><th>Дата</th><th>Действие</th></tr>';
        data.forEach(row => {
          const date = new Date(row.played_at).toLocaleString('ru-RU');
          const resClass = row.result === 'win' ? 'win' : row.result === 'timeout' ? 'timeout' : 'loss';
          const resText = row.result === 'win' ? 'Победа' : row.result === 'timeout' ? 'Таймаут' : 'Поражение';
          const settingsStr = `${row.word_length || '-'} / ${row.difficulty || '-'} / ${row.order_type || '-'}`;

          html += `<tr>
            <td>${row.id}</td>
            <td>${row.player_name}</td>
            <td>${row.word}</td>
            <td>${row.score}</td>
            <td class="${resClass}">${resText}</td>
            <td>${settingsStr}</td>
            <td>${date}</td>
            <td><button class="del-btn" onclick="deleteRow(${row.id})">Удалить</button></td>
          </tr>`;
        });
        html += '</table>';
        document.getElementById('content').innerHTML = html;
      } catch (e) {
        document.getElementById('content').innerText = 'Ошибка загрузки данных.';
      }
    }

    async function deleteRow(id) {
      if (!confirm('Точно удалить эту запись?')) return;
      try {
        const res = await fetch(`/api/delete?id=${id}`, {
          method: 'DELETE',
          headers: { 'X-User': user.username }
        });
        if (res.ok) loadStats();
        else alert('Ошибка удаления');
      } catch (e) { alert('Ошибка сети'); }
    }

    function logout() {
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    loadStats();
  </script>
</body>
</html>
